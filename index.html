<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Science Main Notes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px 22px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            color: #222;
            font-size: 25px;
        }

        p {
            color: #666;
            margin: 10px 0 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 17px;
            text-align: center;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        button:active {
            transform: scale(0.98);
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">📚</div>

        <h1>Science Main Notes</h1>

        <p>Enter PIN to open your Science Notes PDF</p>

        <input
            type="password"
            id="pin"
            placeholder="Enter PIN"
            maxlength="4"
        >

        <button onclick="checkPIN()">
            🔓 Open PDF
        </button>

        <div id="message"></div>

    </div>

    <script>
        const correctPIN = "7889";

        const pdfLink =
            "https://drive.google.com/file/d/1RfAy-7mWHD-s1tV5ZRQzL1XJs7HUUTNo/view?usp=drivesdk";

        function checkPIN() {

            const enteredPIN =
                document.getElementById("pin").value;

            const message =
                document.getElementById("message");

            if (enteredPIN === correctPIN) {

                message.style.color = "green";
                message.innerText = "✅ PIN correct! Opening PDF...";

                setTimeout(function() {
                    window.location.href = pdfLink;
                }, 500);

            } else {

                message.style.color = "red";
                message.innerText = "❌ Wrong PIN!";

            }
        }
    </script>

</body>
</html>
